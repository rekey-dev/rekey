# Rekey — API deployment unit (Dokploy compose service "rekey-api").
#
# One of three independent hosted-deploy composes (api / panel / marketing),
# split so each app deploys, restarts, and rolls back on its own — a panel
# update never rebuilds or restarts the API. All three build targets of the
# single root Dockerfile. The full self-host stack remains
# docker-compose.prod.yml; these files are for OUR hosted deployment.
#
# Datastores:
#   - Postgres is Neon (managed) — DATABASE_URL comes fully-formed from the
#     Dokploy environment. No postgres container here.
#   - Redis stays a container, private to this compose: the architecture
#     tolerates Redis loss (DB is source of truth, poller backstops the
#     webhook queue), so managed Redis buys nothing (decisions.md 2026-07-28).
#
# Secrets policy: every secret is a ${VAR} read from the Dokploy service
# environment — nothing secret lives in this file. This service's env is the
# ONLY place SUPER_ADMIN_KEY / ENCRYPTION_KEY / JWT_SECRET exist; panel and
# marketing deliberately receive no secrets at all.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      # Healthcheck auth without the password appearing in argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [rekey-api-internal]

  api:
    build:
      context: .
      target: api-runtime
    image: rekey-api:hosted
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      # Liveness, deliberately NOT /health/ready: restarting the API cannot fix a
      # Postgres or Redis outage, and a restart loop during one slows recovery.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      NODE_ENV: production
      # Neon Postgres — full connection string from the Dokploy environment
      # (pooled endpoint, sslmode=require).
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPER_ADMIN_KEY: ${SUPER_ADMIN_KEY}
      # Network gate on the super-admin surface, checked BEFORE the key
      # comparison (middleware/admin-auth.ts). Comma-separated IPs/CIDRs; unset
      # means no network restriction, which is how it shipped — the variable
      # existed and was documented but was in no compose file, so setting it in
      # Dokploy did nothing and the gate was inert on every deployment. Compose
      # `environment:` blocks are allowlists; a variable absent here never
      # reaches the container.
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      API_URL: https://api.rekey.dev
      # Public base used to auto-register provider webhooks (Stripe/PayPal).
      PUBLIC_WEBHOOK_BASE_URL: https://api.rekey.dev
      # Hosted customer portal origin — auto-allowed for publishable-key calls
      # from portal-enabled apps. Portal is not deployed yet; harmless to keep.
      PUBLIC_PORTAL_URL: https://portal.rekey.dev
      # Operator-facing links (MCP consent screen, emailed workspace invites).
      # Explicit because the API no longer defaults it — a default would send a
      # self-hoster's operators to Rekey's panel. This service previously relied
      # on that default without ever setting the variable.
      PANEL_URL: https://panel.rekey.dev
      CORS_ALLOWED_ORIGINS: https://panel.rekey.dev,https://rekey.dev,https://portal.rekey.dev
      # Behind Cloudflare -> Traefik: trust exactly one proxy hop (Traefik) so
      # per-IP rate limiting keys on the real client, not Traefik's IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      # Operator registration policy: open | invite | closed. Hosted default is
      # invite (paid, provisioned access); self-hosters override as needed.
      OPERATOR_SIGNUP_MODE: ${OPERATOR_SIGNUP_MODE:-invite}
      # Starting ceilings for every workspace this deployment creates (JSON,
      # TenantLimitsSchema). Empty = unlimited, which is the self-host default;
      # named here so the value can be set from the Dokploy environment at all —
      # a compose `environment:` block is an allowlist, and a variable missing
      # from it never reaches the container.
      DEFAULT_TENANT_LIMITS: ${DEFAULT_TENANT_LIMITS:-}
      # Whether an operator may create additional workspaces themselves:
      # open | disabled. Empty default = open (today's behavior).
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-open}
      # Default transactional email via Resend. Only the API key is a secret;
      # sender is fixed and the rekey.dev domain must be verified in Resend.
      RESEND_DEFAULT_API_KEY: ${RESEND_DEFAULT_API_KEY}
      RESEND_DEFAULT_FROM: support@rekey.dev
      RESEND_DEFAULT_FROM_NAME: Rekey
      # Last-resort base URL for links in transactional emails, after the SDK
      # call, the per-Application setting, and the app's first redirect URL.
      # Empty = unset, and unset means emails omit the button rather than link
      # somewhere broken. Named here because a compose `environment:` block is
      # an allowlist — a variable missing from it never reaches the container.
      DEFAULT_APP_URL: ${DEFAULT_APP_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-api.rule=Host(`api.rekey.dev`)
      - traefik.http.routers.rekey-api.entrypoints=websecure
      - traefik.http.routers.rekey-api.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-api.loadbalancer.server.port=3030
    networks: [rekey-api-internal, dokploy-network]

volumes:
  redis-data:

networks:
  rekey-api-internal:
  dokploy-network:
    external: true
