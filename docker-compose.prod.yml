# Rekey — SELF-HOST production stack (Traefik-routed, e.g. Dokploy).
#
# Deploys: postgres + redis (PRIVATE network) + api + panel + portal, each on a
# hostname YOU supply. This is the file DEPLOY.md documents and the one that
# ships to the public mirror.
#
# NOT the file Rekey Cloud runs. Our own hosted deployment is one independent
# compose per unit against managed Postgres — see the header of
# the per-unit composes Rekey runs. Those exist so each unit deploys and rolls back on its
# own; this one exists so a self-hoster gets the whole product from a single
# `up`. Keeping them separate is what stops
# our hostnames, our analytics ids and our mail sender leaking into a self-host
# deployment, which is exactly what happened while this file carried them as
# literals: `PUBLIC_WEBHOOK_BASE_URL: https://api.rekey.dev` meant a self-hoster
# configured their own Stripe account to POST payment webhooks at OUR server.
#
# EVERY deployment-specific value below is `${VAR}` with no Rekey default. Three
# of them have no default at all and fail the `docker compose` command when
# unset — API_HOST, PANEL_HOST, PORTAL_HOST — because there is no value we could
# pick for them that is not either wrong or ours.
#
# Notes:
#   - Set this as the Compose file of a Dokploy "Compose" service (or run it
#     with `docker compose -f docker-compose.prod.yml up -d` behind your own
#     Traefik).
#   - All values come from the deployment environment (.env.production /
#     the Dokploy service Environment). See `.env.production.example`.
#   - Service names (api/panel/portal) MUST match the Dokploy domain
#     attachments — don't rename them.
#   - NETWORK ISOLATION (important): Postgres + Redis live on a PRIVATE
#     `rekey-internal` network and are NOT on the shared `dokploy-network`.
#     On the shared network a service name is a DNS alias, so a `postgres`/
#     `redis` there collides with other Dokploy apps' DBs (it once shadowed a
#     sibling app's `postgres`, failing its auth). Keeping the DB/cache private
#     prevents that; only the web services join `dokploy-network` for Traefik.
#   - DNS: point A records for the domains at the host BEFORE deploying
#     (Let's Encrypt needs them resolvable).
#   - Migrations run automatically: the api container executes
#     `prisma migrate deploy` on start (idempotent) before booting.
#   - The api `environment:` block below is an ALLOWLIST and is deliberately
#     COMPLETE: every variable `apps/api/src/config/env.ts` reads is named here,
#     even the ones that are empty by default. A variable missing from the block
#     never reaches the container, so setting it in Dokploy silently does
#     nothing — five separate incidents of exactly that shape are recorded in
#     this repo's history. `.github/scripts/check-compose-env.mjs` now fails CI
#     when a new key is added to env.ts without landing here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: rekey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rekey
    volumes:
      - rekey_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekey -d rekey"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rekey-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # AOF persistence so BullMQ webhook-delivery jobs (delayed retries) survive a
    # Redis restart. The DB retry poller backstops any gap; durable queue state
    # avoids needless re-deliveries on a bounce.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      # redis-cli reads this, so the healthcheck doesn't put the password in an
      # argv element visible via `docker inspect`.
      #
      # Plain ${VAR} rather than ${VAR:?err}: the fail-fast form is reserved for
      # the three hostnames, where a wrong value is silently wrong rather than
      # loudly broken. A missing password fails the container start with a clear
      # Postgres/Redis error of its own.
      #
      # NOTE: the password lands in REDIS_URL unencoded, so keep it URL-safe.
      # `openssl rand -hex 24` is; a password containing @ : / or # would not be.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - rekey_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rekey-internal]

  api:
    build:
      context: .
      target: api-runtime
    image: rekey-api:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Liveness, deliberately NOT /health/ready: restarting the API cannot fix a
      # Postgres or Redis outage, and a restart loop during one slows recovery.
      # Traefik/LB health gating should use /health or /health/ready instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      NODE_ENV: production
      # PORT and HOST are deliberately NOT settable here: the healthcheck above
      # and the Traefik port label below both hardcode 3030, so a changed port
      # would route traffic nowhere while every probe still passed.
      DATABASE_URL: postgresql://rekey:${POSTGRES_PASSWORD}@postgres:5432/rekey?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # How long one API process may reuse its snapshot of an Application's
      # organization-role catalog. Writes invalidate locally and publish over
      # Redis, so this is the backstop for a Redis outage, not the normal
      # propagation path. 0 disables the cache. See docs/organization-roles.md.
      ORG_ROLE_CACHE_TTL_MS: ${ORG_ROLE_CACHE_TTL_MS:-}

      # ── Secrets ──────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPER_ADMIN_KEY: ${SUPER_ADMIN_KEY}
      # Optional RS256 signing key for end-user access tokens. Unset = a keypair
      # is generated on first use and stored (private half encrypted).
      JWT_RS256_PRIVATE_KEY: ${JWT_RS256_PRIVATE_KEY:-}
      # Network gate on the super-admin surface, checked BEFORE the key
      # comparison (middleware/admin-auth.ts). Comma-separated IPs/CIDRs; unset
      # means no network restriction, which is how it shipped.
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}

      # ── Public origins ───────────────────────────────────────────────────
      # Derived from the three hostnames so there is one place to change a
      # domain. Override any of them individually if your public origin differs
      # from what Traefik routes (a path prefix, a CDN, a different scheme).
      API_URL: ${API_URL:-https://${API_HOST}}
      # The origin Rekey auto-registers with Stripe/PayPal as the destination
      # for YOUR payment webhooks. It must be internet-reachable and it must be
      # yours — see the header.
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-https://${API_HOST}}
      # Hosted customer portal origin — auto-allowed for publishable-key calls
      # from portal-enabled apps (CORS + per-app origin check).
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-https://${PORTAL_HOST}}
      # Operator-facing links: the MCP OAuth consent redirect and emailed
      # workspace invites are built from this.
      PANEL_URL: ${PANEL_URL:-https://${PANEL_HOST}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${PANEL_HOST},https://${PORTAL_HOST}}
      # Base origin for the operator OAuth redirect URI
      # `<base>/login/oauth/<provider>/callback`. Falls back to the first CORS
      # entry (preferring a `panel.` host) when unset.
      PANEL_OAUTH_REDIRECT_BASE: ${PANEL_OAUTH_REDIRECT_BASE:-}
      # Last-resort base URL for links in transactional emails, after the SDK
      # call, the per-Application setting, and the app's first redirect URL.
      # Empty = unset, and unset means emails omit the button rather than link
      # somewhere broken.
      DEFAULT_APP_URL: ${DEFAULT_APP_URL:-}
      # Behind a reverse proxy: a hop count or an IP/CIDR allowlist. Unset means
      # X-Forwarded-For is not trusted, so rate limits and lockout key on the
      # proxy's IP rather than the real client.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      # ── Transactional email (Resend) ─────────────────────────────────────
      # Unset = Rekey sends no mail and returns raw tokens to the caller
      # instead. The from-address must be on a domain YOU verified in Resend.
      RESEND_DEFAULT_API_KEY: ${RESEND_DEFAULT_API_KEY:-}
      RESEND_DEFAULT_FROM: ${RESEND_DEFAULT_FROM:-}
      RESEND_DEFAULT_FROM_NAME: ${RESEND_DEFAULT_FROM_NAME:-}

      # ── Registration + tenancy policy ────────────────────────────────────
      # Who may create an OPERATOR account: open | invite | closed. Empty =
      # open, which is self-serve sign-up for anyone who can reach the panel.
      # A private deployment wants `invite` or `closed`; there was previously no
      # way to set either, because this variable was missing from this block.
      OPERATOR_SIGNUP_MODE: ${OPERATOR_SIGNUP_MODE:-}
      # Whether a signed-in operator may create ADDITIONAL workspaces:
      # open (default) | disabled. Pairs with DEFAULT_TENANT_LIMITS — a ceiling
      # per workspace means little if anyone can mint a fresh one.
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-}
      # Starting ceilings for every workspace this deployment creates (JSON,
      # TenantLimitsSchema — e.g. {"maxProductionApps":1}). Empty = unlimited.
      DEFAULT_TENANT_LIMITS: ${DEFAULT_TENANT_LIMITS:-}

      # ── Operator panel auth (WebAuthn + social login) ────────────────────
      # One relying party across all tenants. `rpId` is the panel hostname (no
      # scheme, no port); unset means operator passkeys refuse with
      # WEBAUTHN_NOT_CONFIGURED rather than binding to a guessable id.
      PANEL_WEBAUTHN_RP_ID: ${PANEL_WEBAUTHN_RP_ID:-}
      PANEL_WEBAUTHN_RP_ORIGINS: ${PANEL_WEBAUTHN_RP_ORIGINS:-}
      PANEL_WEBAUTHN_RP_NAME: ${PANEL_WEBAUTHN_RP_NAME:-}
      # A provider activates only when BOTH its id and secret are set.
      PANEL_OAUTH_GOOGLE_CLIENT_ID: ${PANEL_OAUTH_GOOGLE_CLIENT_ID:-}
      PANEL_OAUTH_GOOGLE_CLIENT_SECRET: ${PANEL_OAUTH_GOOGLE_CLIENT_SECRET:-}
      PANEL_OAUTH_GITHUB_CLIENT_ID: ${PANEL_OAUTH_GITHUB_CLIENT_ID:-}
      PANEL_OAUTH_GITHUB_CLIENT_SECRET: ${PANEL_OAUTH_GITHUB_CLIENT_SECRET:-}
      # "Sign in with <this deployment>" — operator sign-in against one of this
      # deployment's own Applications, via the generic OIDC provider. All three
      # are needed together; the issuer is `https://<api>/api/v1/mcp/<slug>`.
      PANEL_OAUTH_REKEY_CLIENT_ID: ${PANEL_OAUTH_REKEY_CLIENT_ID:-}
      PANEL_OAUTH_REKEY_CLIENT_SECRET: ${PANEL_OAUTH_REKEY_CLIENT_SECRET:-}
      PANEL_OAUTH_REKEY_ISSUER: ${PANEL_OAUTH_REKEY_ISSUER:-}

      # ── Feature switches + limits ────────────────────────────────────────
      # Operator/tenant MCP HTTP surface. Empty = enabled; only the literal
      # "false" turns it off (it exposes the mint_api_key write tool).
      OPERATOR_MCP_ENABLED: ${OPERATOR_MCP_ENABLED:-}
      # RFC 7591 dynamic client registration on the operator MCP authorization
      # server: empty/`open` = anyone may register a client (how Claude Desktop
      # / Code / Cursor connect); `disabled` closes it. Worth closing once your
      # clients are connected — a registration allowlists a redirect_uri of the
      # registrant's choosing, which is what a consent-phishing link needs.
      OPERATOR_MCP_DYNAMIC_REGISTRATION: ${OPERATOR_MCP_DYNAMIC_REGISTRATION:-}
      # Operator sign-in by OIDC ID Token assertion
      # (POST /api/v1/tenant/auth/oidc/assert). BOTH must be set or the
      # endpoint 404s — a deployment that has not opted in has no assertion
      # surface at all. This is how Rekey Cloud signs a buyer into the panel
      # with the account they already have on the marketing site.
      OPERATOR_OIDC_ISSUER: ${OPERATOR_OIDC_ISSUER:-}
      OPERATOR_OIDC_CLIENT_ID: ${OPERATOR_OIDC_CLIENT_ID:-}
      # Kill-switch for the HIBP Pwned Passwords lookup — "true" for offline or
      # restricted-egress deployments.
      HIBP_BREACH_CHECK_DISABLED: ${HIBP_BREACH_CHECK_DISABLED:-}
      # "true" lets outbound webhooks target private/internal addresses. Leave
      # empty on an internet-facing deployment: it is the SSRF guard.
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-}
      # Global rate limit, and the higher per-key cap for usage ingestion.
      # Empty = 100 req / 60s, and 1000 for POST /api/v1/usage/record.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_USAGE_MAX: ${RATE_LIMIT_USAGE_MAX:-}
      # Prisma connection-pool sizing. Empty = 20 connections / 10s timeout;
      # read the docblock in apps/api/src/lib/prisma.ts before lowering it, as
      # the webhook worker runs at concurrency 10 against the same client.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-api.rule=Host(`${API_HOST:?set API_HOST in .env, e.g. api.example.com}`)
      - traefik.http.routers.rekey-api.entrypoints=websecure
      - traefik.http.routers.rekey-api.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-api.loadbalancer.server.port=3030
    # dokploy-network: reachable by Traefik. rekey-internal: reach postgres/redis.
    networks: [rekey-internal, dokploy-network]

  panel:
    build:
      context: .
      target: panel-runtime
      args:
        # Compiled into the client bundle — the runtime `environment:` below
        # cannot change these after the build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${API_HOST}}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${PANEL_HOST}}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://${PORTAL_HOST}}
        # Your analytics property, not ours. No default: a default here would
        # report a self-hoster's operators to Rekey's GA4.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: rekey-panel:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side panel → API calls stay on the private network.
      REKEY_URL: http://api:3030
      PANEL_URL: ${PANEL_URL:-https://${PANEL_HOST}}
      # Leave empty. Session cookies get `Secure` from the request — Traefik
      # terminates TLS and sets X-Forwarded-Proto: https, which is what the
      # panel reads. Only set this (to "false") if you front this stack with
      # something that serves plain HTTP and sets no forwarded proto, and you
      # accept session cookies travelling in the clear.
      REKEY_COOKIE_SECURE: ${REKEY_COOKIE_SECURE:-}
      # Where THIS deployment points an operator who authenticated fine but has
      # not been granted access here, and what the link says. Both optional:
      # unset, the panel states the fact and offers no destination, which is
      # right when you hand out invite keys by your own means. This block is an
      # allowlist — a variable set in .env but missing here never reaches the
      # container, which is silent and has bitten this file before.
      PANEL_SIGNUP_HELP_URL: ${PANEL_SIGNUP_HELP_URL:-}
      PANEL_INVITE_HELP_URL: ${PANEL_INVITE_HELP_URL:-}
      PANEL_INVITE_HELP_TEXT: ${PANEL_INVITE_HELP_TEXT:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-panel.rule=Host(`${PANEL_HOST:?set PANEL_HOST in .env, e.g. panel.example.com}`)
      - traefik.http.routers.rekey-panel.entrypoints=websecure
      - traefik.http.routers.rekey-panel.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-panel.loadbalancer.server.port=3031
    networks: [rekey-internal, dokploy-network]

  # Hosted multi-app customer portal (Portal V2) at <PORTAL_HOST>/<slug>.
  # ONE deployment serves every opted-in Application — no per-app deploy, no
  # secret key. Operators enable it per Application in Panel → Application →
  # Billing → Portal. The portal identifies each app by its publishable key
  # (fetched via /api/v1/portal/config/:slug) and authorizes users with their
  # own token. See docs/portal.md.
  #
  # Not running a customer portal? Delete this service AND the three PORTAL_HOST
  # references above — the api's `PUBLIC_PORTAL_URL`, its `CORS_ALLOWED_ORIGINS`
  # entry, and the panel's `NEXT_PUBLIC_PORTAL_URL` build arg. Leaving them with
  # PORTAL_HOST unset would hand the API the string `https://`, which is not a
  # URL and fails the boot.
  portal:
    build:
      context: .
      target: portal-runtime
    image: rekey-portal:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side portal → API calls stay on the private network.
      REKEY_URL: http://api:3030
      # Public URL of this portal — checkout success/cancel return links.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://${PORTAL_HOST}}
      # Leave empty — see the panel service above.
      REKEY_COOKIE_SECURE: ${REKEY_COOKIE_SECURE:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-portal.rule=Host(`${PORTAL_HOST:?set PORTAL_HOST in .env, e.g. portal.example.com}`)
      - traefik.http.routers.rekey-portal.entrypoints=websecure
      - traefik.http.routers.rekey-portal.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-portal.loadbalancer.server.port=3050
    networks: [rekey-internal, dokploy-network]


volumes:
  rekey_postgres:
  rekey_redis:

networks:
  dokploy-network:
    external: true
  # Private to this stack — keeps Postgres/Redis (and api↔panel traffic) off the
  # shared network so generic names can't collide with other Dokploy apps.
  rekey-internal:
    driver: bridge
