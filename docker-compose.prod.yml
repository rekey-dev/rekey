# Rekey — production stack for Dokploy (Traefik-routed).
#
# Deploys: postgres + redis (PRIVATE network) + api (api.rekey.dev) + panel
# (panel.rekey.dev) + portal (portal.rekey.dev)
#
# Dokploy notes:
#   - Set this as the Compose file of a Dokploy "Compose" service.
#   - All env values below come from the Dokploy environment (.env.production).
#   - Service names (api/panel/portal) MUST match the Dokploy domain
#     attachments — don't rename them.
#   - NETWORK ISOLATION (important): Postgres + Redis live on a PRIVATE
#     `rekey-internal` network and are NOT on the shared `dokploy-network`.
#     On the shared network a service name is a DNS alias, so a `postgres`/
#     `redis` there collides with other Dokploy apps' DBs (it once shadowed a
#     sibling app's `postgres`, failing its auth). Keeping the DB/cache private
#     prevents that; only the web services join `dokploy-network` for Traefik.
#   - DNS: point A records for the domains at the Dokploy host BEFORE deploying
#     (Let's Encrypt needs them resolvable).
#   - Migrations run automatically: the api container executes
#     `prisma migrate deploy` on start (idempotent) before booting.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: rekey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rekey
    volumes:
      - rekey_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekey -d rekey"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rekey-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # AOF persistence so BullMQ webhook-delivery jobs (delayed retries) survive a
    # Redis restart. The DB retry poller backstops any gap; durable queue state
    # avoids needless re-deliveries on a bounce.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      # redis-cli reads this, so the healthcheck doesn't put the password in an
      # argv element visible via `docker inspect`.
      #
      # Plain ${VAR} rather than ${VAR:?err}: the fail-fast form belongs in the
      # self-host compose, where a human is filling in a .env. Here the variable
      # is set in the Dokploy compose environment (same mechanism as
      # POSTGRES_PASSWORD below, which is proven in production), and this file is
      # parsed by whatever compose version Dokploy ships — not worth depending on
      # a syntax that isn't already exercised in this file.
      #
      # NOTE: the password lands in REDIS_URL unencoded, so keep it URL-safe.
      # `openssl rand -hex 24` is; a password containing @ : / or # would not be.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - rekey_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rekey-internal]

  api:
    build:
      context: .
      target: api-runtime
    image: rekey-api:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Liveness, deliberately NOT /health/ready: restarting the API cannot fix a
      # Postgres or Redis outage, and a restart loop during one slows recovery.
      # Traefik/LB health gating should use /health or /health/ready instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rekey:${POSTGRES_PASSWORD}@postgres:5432/rekey?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPER_ADMIN_KEY: ${SUPER_ADMIN_KEY}
      # Network gate on the super-admin surface, checked BEFORE the key
      # comparison (middleware/admin-auth.ts). Comma-separated IPs/CIDRs; unset
      # means no network restriction, which is how it shipped — the variable
      # existed and was documented but was in no compose file, so setting it in
      # Dokploy did nothing and the gate was inert on every deployment. Compose
      # `environment:` blocks are allowlists; a variable absent here never
      # reaches the container.
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      API_URL: https://api.rekey.dev
      # Public base used to auto-register provider webhooks (Stripe/PayPal).
      PUBLIC_WEBHOOK_BASE_URL: https://api.rekey.dev
      # Hosted customer portal origin — auto-allowed for publishable-key calls
      # from portal-enabled apps (CORS + per-app origin check).
      PUBLIC_PORTAL_URL: https://portal.rekey.dev
      CORS_ALLOWED_ORIGINS: https://panel.rekey.dev,https://rekey.dev,https://portal.rekey.dev
      # Default transactional email via Resend. Only the API key is a secret
      # (set in the Dokploy environment); sender is fixed.
      RESEND_DEFAULT_API_KEY: ${RESEND_DEFAULT_API_KEY}
      RESEND_DEFAULT_FROM: support@rekey.dev
      RESEND_DEFAULT_FROM_NAME: Rekey
      # Last-resort base URL for links in transactional emails, after the SDK
      # call, the per-Application setting, and the app's first redirect URL.
      # Empty = unset, and unset means emails omit the button rather than link
      # somewhere broken. Named here because a compose `environment:` block is
      # an allowlist — a variable missing from it never reaches the container.
      DEFAULT_APP_URL: ${DEFAULT_APP_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-api.rule=Host(`api.rekey.dev`)
      - traefik.http.routers.rekey-api.entrypoints=websecure
      - traefik.http.routers.rekey-api.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-api.loadbalancer.server.port=3030
    # dokploy-network: reachable by Traefik. rekey-internal: reach postgres/redis.
    networks: [rekey-internal, dokploy-network]

  panel:
    build:
      context: .
      target: panel-runtime
      args:
        # Compiled into the client bundle — the runtime `environment:` below
        # cannot change these after the build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.rekey.dev}
        NEXT_PUBLIC_APP_URL: ${PANEL_URL:-https://panel.rekey.dev}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: rekey-panel:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side panel → API calls stay on the private network.
      REKEY_URL: http://api:3030
      PANEL_URL: https://panel.rekey.dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-panel.rule=Host(`panel.rekey.dev`)
      - traefik.http.routers.rekey-panel.entrypoints=websecure
      - traefik.http.routers.rekey-panel.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-panel.loadbalancer.server.port=3031
    networks: [rekey-internal, dokploy-network]

  # Hosted multi-app customer portal (Portal V2) at portal.rekey.dev/<slug>.
  # ONE deployment serves every opted-in Application — no per-app deploy, no
  # secret key. Operators enable it per Application in Panel → Application →
  # Billing → Portal. The portal identifies each app by its publishable key
  # (fetched via /api/v1/portal/config/:slug) and authorizes users with their
  # own token. See docs/portal.md.
  portal:
    build:
      context: .
      target: portal-runtime
    image: rekey-portal:prod
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side portal → API calls stay on the private network.
      REKEY_URL: http://api:3030
      # Public URL of this portal — checkout success/cancel return links.
      PORTAL_BASE_URL: https://portal.rekey.dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-portal.rule=Host(`portal.rekey.dev`)
      - traefik.http.routers.rekey-portal.entrypoints=websecure
      - traefik.http.routers.rekey-portal.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-portal.loadbalancer.server.port=3050
    networks: [rekey-internal, dokploy-network]

  # NOTE: the super-admin UI (apps/admin) is deliberately NOT deployed.
  # It runs as a local app against the production API when needed
  # (see apps/admin/README.md). Decision logged in decisions.md 2026-07-28.


volumes:
  rekey_postgres:
  rekey_redis:

networks:
  dokploy-network:
    external: true
  # Private to this stack — keeps Postgres/Redis (and api↔panel traffic) off the
  # shared network so generic names can't collide with other Dokploy apps.
  rekey-internal:
    driver: bridge
