name: Release SDK

# Publish @rekey SDK packages to npm when a GitHub Release is published.
# Only packages whose version is NOT already on npm are published — so bump
# just the package(s) you changed (and any that depend on them) and only those
# go out; unchanged packages are skipped. Packages are walked in dependency
# order so a new dependency publishes before its dependents (pnpm rewrites
# each `workspace:*` to the published version).
#
# Requires repo secret NPM_TOKEN (npm org `rekey`, automation token).
# Alpha and beta versions publish under the `beta` dist-tag; release
# candidates and stable versions publish under `latest` — see the comment on
# the publish step for why an RC takes `latest`.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish SDK to npm
    # Only run from the public OSS repo — npm publishing is triggered by the
    # GitHub Release that publish-public.yml creates on rekey-dev/rekey.
    # This guard prevents accidental double-publish if a Release is ever
    # created manually on the private repo.
    if: github.repository == 'rekey-dev/rekey'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm --filter "./packages/*" build

      # Publish ONLY packages whose version isn't already on npm. Walk in
      # dependency order (shared-types → node → react/mcp → nextjs/cli) so a new
      # dependency lands before its dependents. pnpm ignores publishConfig.tag,
      # so derive --tag per package.
      #
      # Release candidates take `latest`, not `beta`. `latest` is what a bare
      # `npm i @rekey.dev/node` resolves to, and it should point at the SDK that
      # matches the API we actually run. Leaving it on the previous major while
      # an RC is deployed hands every new install an SDK that no longer speaks
      # to the live API. Existing `^1` dependents are unaffected either way:
      # semver ranges never match a prerelease, so this only moves the default
      # for people installing fresh — which is precisely who needs the RC.
      # Alpha and beta versions are still `beta`; those are not meant to be the
      # default install.
      - name: Publish changed packages to npm
        run: |
          set -e
          for dir in shared-types sdk-node sdk-react mcp sdk-nextjs cli; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            ver=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver — already on npm"
              continue
            fi
            case "$ver" in
              *-rc.*)  tag=latest;;
              *-*)     tag=beta;;
              *)       tag=latest;;
            esac
            echo "publish $name@$ver (dist-tag $tag)"
            pnpm --filter "$name" publish --no-git-checks --access public --tag "$tag"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
