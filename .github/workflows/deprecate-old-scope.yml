name: Deprecate old @relipay scope

# One-shot: marks every version of the six @relipay/* packages deprecated on
# npm, pointing consumers at the @rekey.dev/* replacements. Safe to re-run
# (deprecation is idempotent). Uses the same NPM_TOKEN as release.yml.

on:
  workflow_dispatch:

jobs:
  deprecate:
    if: github.repository == 'rekey-dev/rekey'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate @relipay/* packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in shared-types node react nextjs cli mcp; do
            npm deprecate "@relipay/$p@*" \
              "ReliPay is now Rekey — this package moved to @rekey.dev/$p. @relipay/$p receives no further updates, and 1.1.1 sends the old X-Relipay-User-Token header that Rekey servers >= 1.1.2 no longer accept. Install @rekey.dev/$p."
            echo "deprecated @relipay/$p"
          done
