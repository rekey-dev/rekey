name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the provider-sandbox job below, which is the only job
  # here that needs secrets and a third party to be up.
  workflow_dispatch:
    inputs:
      run_provider_sandbox:
        description: 'Run the payment-provider sandbox suite (needs repo secrets)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Independent jobs instead of one serial one. Build (306s) and tests
# (300s) used to run back to back in a single job, so wall-clock was their sum.
# They share no state, so they now run in parallel and the slowest sets the
# time. Typecheck is split out because it is the fastest signal by far — a type
# error surfaces in about a minute instead of after a full Next build.
jobs:
  # Static config invariants. No install, no database — a checkout and node.
  # Kept out of the typecheck job so it reports as its own red check: a
  # deployment file that cannot express a setting is a different failure from a
  # type error, and the two get fixed by different edits.
  config:
    name: Config guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Same shape as the `prisma migrate diff --exit-code` step in the test
      # job: two artifacts that are supposed to agree, compared mechanically.
      # Here it is apps/api/src/config/env.ts against the `environment:` blocks
      # of the compose files that run an API. A compose block is an ALLOWLIST,
      # so a key missing from it can never be set — five separate incidents of
      # that shape are recorded in this repo, each with a comment and no guard.
      - name: Check compose files expose every env var the API reads
        run: node .github/scripts/check-compose-env.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api imports @prisma/client types that only exist after generate.
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache
      # turbo, not `pnpm -r`. Every workspace consumes its dependencies from
      # dist, and turbo.json already declares `typecheck: dependsOn ^build`, so
      # turbo builds exactly those first. Hand-listing the packages here is how
      # the previous version of this file broke: miss one and tsc reports a
      # cascade of phantom "cannot find module" errors in unrelated files.
      - run: pnpm exec turbo run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekey
          POSTGRES_PASSWORD: rekey
          POSTGRES_DB: rekey
        ports: ['5432:5432']
        # A service container with a healthcheck replaces the hand-rolled
        # `docker run` + poll loop: the job does not start until Postgres
        # actually answers queries.
        options: >-
          --health-cmd "pg_isready -U rekey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache

      # Build the libraries in parallel FIRST so the serial test run below hits
      # warm turbo cache for its `^build` dependencies instead of rebuilding
      # them one at a time. No app bundles: the suites import packages/* from
      # dist and never the panel/portal/admin/marketing builds.
      #
      # dist is load-bearing, not an optimisation: without it ~74 test files
      # fail to LOAD, and vitest reports that as a smaller passing count rather
      # than an error — a green-looking run proving nothing.
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="./packages/*"

      - name: Create test databases
        run: |
          PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_test;"
          PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_shadow;"

      - name: Verify migrations apply
        run: |
          DATABASE_URL=postgresql://rekey:rekey@localhost:5432/rekey?schema=public \
            pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      # The step above proves the migrations RUN. It does not prove they build
      # the schema `schema.prisma` describes. Editing the model without
      # generating the matching migration still applies cleanly to an empty
      # database and then diverges from every real one — drift that surfaces as
      # a Prisma runtime error in production, not as a red build.
      # `migrate diff --exit-code` replays the migration folder into a shadow
      # database and compares it to the datamodel. Exit 2 = they differ: run
      # `pnpm --filter @rekey.dev/api db:migrate` and commit the generated SQL.
      - name: Check schema.prisma matches its migrations
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://rekey:rekey@localhost:5432/rekey_shadow?schema=public \
            --exit-code

      # concurrency=1 is deliberate and must stay: every suite shares ONE
      # database and truncates between files, so two packages testing at once
      # eat each other's fixtures. This is the one place serialisation is
      # correctness, not slowness — do not "optimise" it.
      #
      # apps/api is invoked directly instead of through turbo so it can emit a
      # coverage report. It is the SAME single run, not an extra one, and it
      # stays sequential with the package tests below for the reason above.
      - name: Run API tests (with coverage)
        env:
          TEST_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_test?schema=public
          SUPER_ADMIN_KEY: test-admin-key-test-admin-key-test-admin-key
          JWT_SECRET: test-jwt-secret-test-jwt-secret-test-jwt-secret
        run: pnpm --filter @rekey.dev/api run test:coverage

      # Runs even when the thresholds fail — "what is the number now" is
      # exactly what you want in the summary when the gate is red.
      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f apps/api/coverage/coverage-summary.json ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### apps/api coverage"
            echo
            echo "| metric | covered | total | % |"
            echo "| --- | ---: | ---: | ---: |"
            node -e '
              const fs = require("fs");
              const path = "apps/api/coverage/coverage-summary.json";
              const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
              for (const key of ["lines", "statements", "functions", "branches"]) {
                const m = total[key];
                console.log("| " + key + " | " + m.covered + " | " + m.total + " | " + m.pct + "% |");
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"


      # apps/api is not in this filter because the step above already ran it
      # directly, for coverage. One run, not two.
      - name: Run package + app tests
        env:
          TEST_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_test?schema=public
          SUPER_ADMIN_KEY: test-admin-key-test-admin-key-test-admin-key
          JWT_SECRET: test-jwt-secret-test-jwt-secret-test-jwt-secret
        run: >-
          pnpm exec turbo run test --concurrency=1
          --filter="./packages/*"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache

      # Next caches compilation between runs; without this every build is cold.
      - name: Cache Next.js builds
        uses: actions/cache@v4
        with:
          path: apps/*/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Only the SHIPPED apps. Examples are typechecked by the typecheck job but
      # no longer `next build`-ed: they are reference integrations, not deployed
      # artifacts, and they were roughly a third of this step. The trade-off is
      # real — `next build` catches server-component and static-generation
      # errors tsc does not — so if an example is ever deployed, add it back.
      #
      # turbo pulls each app's workspace dependencies in via `^build`, so the
      # packages/* dists exist before any Next build starts. Filtering with raw
      # `pnpm --filter` instead skips that graph and fails with "Can't resolve
      # '@rekey.dev/react'". No concurrency limit: unlike the tests these share
      # no state, and serialising five Next builds was the single largest cost
      # in the old pipeline.
      - name: Build shipped apps
        # Deliberately example.com, not rekey.dev. These compile into the
        # client bundles, this file is mirrored to the public repo, and CI
        # artifacts are never deployed — real values are passed as Docker build
        # args at deploy time. Baking our own host in here would put a
        # Rekey-owned default back into the open-source tree, which is exactly
        # what #249 removed.
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_APP_URL: https://example.com
        run: >-
          pnpm exec turbo run build
          --filter=@rekey.dev/api --filter=@rekey.dev/panel
          --filter=@rekey.dev/portal

  # ---------------------------------------------------------------------------
  # Payment-provider sandbox suite. NOT part of the pull-request pipeline.
  #
  # It talks to Stripe / PayPal / Razorpay over the network, so it can go red
  # for reasons a contributor cannot fix — and a required check that does that
  # is a check people learn to ignore. `workflow_dispatch` only, on purpose.
  # Run it before a release, and after any change under
  # apps/api/src/modules/billing/providers.
  #
  # Secrets it reads — see docs/provider-sandbox-testing.md for how to get each:
  #   STRIPE_TEST_SECRET_KEY
  #   PAYPAL_SANDBOX_CLIENT_ID / PAYPAL_SANDBOX_CLIENT_SECRET / PAYPAL_SANDBOX_WEBHOOK_ID
  #   RAZORPAY_TEST_KEY_ID / RAZORPAY_TEST_KEY_SECRET
  provider-sandbox:
    name: Provider sandbox (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekey
          POSTGRES_PASSWORD: rekey
          POSTGRES_DB: rekey
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rekey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="./packages/*"

      # Its own database, never rekey_test: the two suites truncate the same
      # tables and would eat each other's fixtures.
      - name: Create the sandbox database
        run: PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_sandbox;"

      - name: Run the provider sandbox suite
        env:
          SANDBOX_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_sandbox?schema=public
          SUPER_ADMIN_KEY: sandbox-admin-key-sandbox-admin-key-sandbox
          JWT_SECRET: sandbox-jwt-secret-sandbox-jwt-secret-sandbox
          # The whole point of a job that HAS the secrets: a rotated or deleted
          # secret must fail it, not skip quietly and report green.
          REKEY_SANDBOX_REQUIRE: all
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_SANDBOX_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
        run: pnpm --filter @rekey.dev/api run test:providers
