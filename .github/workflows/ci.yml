name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the provider-sandbox job below, which is the only job
  # here that needs secrets and a third party to be up.
  workflow_dispatch:
    inputs:
      run_provider_sandbox:
        description: 'Run the payment-provider sandbox suite (needs repo secrets)'
        type: boolean
        default: true
      # The escape hatch for the change detection in the `changes` job. A manual
      # run is already unconditionally full, so this only exists to be explicit
      # about it in the UI: if you are here because you do not trust what CI
      # skipped, this is the button.
      run_full:
        description: 'Run every suite regardless of what changed'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Independent jobs instead of one serial one. Build (306s) and tests
# (300s) used to run back to back in a single job, so wall-clock was their sum.
# They share no state, so they now run in parallel and the slowest sets the
# time. Typecheck is split out because it is the fastest signal by far — a type
# error surfaces in about a minute instead of after a full Next build.
jobs:
  # Which of the expensive jobs below can possibly be affected by this change.
  #
  # Test is ~14 minutes and used to run on every push, including ones that only
  # touched prose. The rules live in a script rather than in `paths:` filters
  # here for two reasons: `paths:` skips the whole WORKFLOW, which leaves a
  # required check permanently pending, and the interesting cases are not
  # path-shaped anyway (a comment-only edit inside apps/api is still a change to
  # apps/api). See .github/scripts/changed-areas.mjs for the reasoning; the
  # short version is that every uncertainty resolves toward running.
  #
  # Nothing cheap is gated on this. Config, OSS strip and Typecheck run
  # unconditionally: they are 6s, 8s and 51s, and making them conditional would
  # buy nothing while adding a way to be wrong. Typecheck in particular MUST
  # stay unconditional, because it is what still catches a `@ts-expect-error`
  # that the detector treats as an inert comment.
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.detect.outputs.api }}
      packages: ${{ steps.detect.outputs.packages }}
      build: ${{ steps.detect.outputs.build }}
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The detector diffs against the MERGE BASE. With the default depth of
          # 1 there is no merge base in the clone, the diff throws, and the
          # script falls back to running everything. That is safe, but the
          # feature would never once have worked. This repo is ~670 commits, so
          # a full clone is a second or two.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # For `typescript`, which the detector uses to tell a comment edit from a
      # real one by comparing ASTs rather than grepping the diff.
      - run: pnpm install --frozen-lockfile

      # The detector deciding NOT to run a suite is invisible when it is wrong:
      # the suite simply never reports, and nobody notices until something
      # ships broken. So its own rules are tested, here, before it is trusted.
      - name: The detector's rules still hold
        run: node .github/scripts/changed-areas.mjs --self-test

      - name: Detect
        id: detect
        env:
          CHANGED_BASE_REF: ${{ github.base_ref }}
          CHANGED_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CHANGED_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGED_PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGED_FORCE_FULL: ${{ inputs.run_full }}
        run: node .github/scripts/changed-areas.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # Static config invariants. No install, no database — a checkout and node.
  # Kept out of the typecheck job so it reports as its own red check: a
  # deployment file that cannot express a setting is a different failure from a
  # type error, and the two get fixed by different edits.
  config:
    name: Config guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Same shape as the `prisma migrate diff --exit-code` step in the test
      # job: two artifacts that are supposed to agree, compared mechanically.
      # Here it is apps/api/src/config/env.ts against the `environment:` blocks
      # of the compose files that run an API. A compose block is an ALLOWLIST,
      # so a key missing from it can never be set — five separate incidents of
      # that shape are recorded in this repo, each with a comment and no guard.
      - name: Check compose files expose every env var the API reads
        run: node .github/scripts/check-compose-env.mjs

  oss-strip:
    name: OSS strip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Private repo only. This file is mirrored to the public repo, but the
    # script it runs is not: the strip deletes itself as part of stripping, so
    # on rekey-dev/rekey the job would fail on a missing file, every run,
    # forever. The mirror image of the guard on release.yml, which publishes to
    # npm and must run ONLY on the public side.
    if: github.repository == 'EtherLabZ/Rekey'
    steps:
      - uses: actions/checkout@v4

      # `clean-for-public.sh` runs exactly once per release, at the moment a tag
      # is pushed, which is the worst possible time to discover it is broken. It
      # exited 1 on main for a full day in August 2026 — the mirror publish and
      # therefore the npm release could not run, and nobody noticed, because
      # nothing else ever executes it. Found by hand, by accident.
      #
      # Two things this job has to get right, both learned the hard way:
      #
      #   - Run it on a tree with NO node_modules. pnpm writes every workspace
      #     member into .modules.yaml, including the two the strip deletes, so
      #     the script's own leak check trips on an installed tree. This job
      #     therefore does not install anything, and must stay before any step
      #     that would.
      #   - The script is destructive and deletes itself as part of the strip,
      #     so it only ever runs against a throwaway. A fresh CI checkout is
      #     exactly that; nothing here is pushed anywhere.
      - name: Strip runs clean against a fresh checkout
        run: bash .github/scripts/clean-for-public.sh

      # The strip's own tripwire greps the public tree for references to what
      # it removed, and fails the release if any survive. This asserts the
      # other direction: a strip that exits 0 having quietly stopped removing
      # things. It is written as an ALLOWLIST of what should remain, both
      # because that also catches a newly added private app nobody remembered
      # to strip, and because listing the removed names here would put them
      # back into the public tree and trip the tripwire — which is exactly what
      # the first draft of this job did.
      - name: Public tree contains only what it should
        run: |
          expected="api panel portal"
          actual=$(ls apps/ | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual" != "$(echo $expected | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')" ]; then
            echo "::error::apps/ after strip is '$actual', expected '$expected'"
            exit 1
          fi
          test -f AGENTS.md || { echo "::error::public AGENTS.md missing"; exit 1; }
          test ! -e docs/specs || { echo "::error::internal specs survived"; exit 1; }

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api imports @prisma/client types that only exist after generate.
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache
      # turbo, not `pnpm -r`. Every workspace consumes its dependencies from
      # dist, and turbo.json already declares `typecheck: dependsOn ^build`, so
      # turbo builds exactly those first. Hand-listing the packages here is how
      # the previous version of this file broke: miss one and tsc reports a
      # cascade of phantom "cannot find module" errors in unrelated files.
      - run: pnpm exec turbo run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    # Skipped outright when neither suite can be affected. The steps inside are
    # ALSO gated individually, because the common case is one side or the other:
    # a change confined to one of the front-end workspaces needs its own suite
    # and has no way to reach the API, and paying 14 minutes for that was the
    # whole complaint.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.packages == 'true'
    # 45, not 20.
    #
    # A healthy run of this job is 9-11 minutes. The old ceiling left under 2x
    # headroom, and GitHub's shared runners are not consistent enough for that:
    # on a slow one every test file takes 2-10x longer — `operator-pat` measured
    # 6.5s on one run and 65s on the next, with the diff between them touching
    # neither — and the job is killed mid-suite with ZERO failing tests. It
    # reports as a red X on the PR, which reads as "your change broke CI".
    #
    # That happened five times in one afternoon across three unrelated
    # branches. It was diagnosed rather than assumed: a same-machine A/B of the
    # suite before and after one of those branches came out 627.7s vs 609.2s,
    # so the diffs were not the cause, and the identical commit passed in
    # 11m27s on a re-run.
    #
    # 45 gives ~4x on a healthy run and survives a 3x-slow runner. It is a
    # ceiling for a hung job, not a performance budget — if the suite ever
    # genuinely approaches it, that is a signal to split it, not to raise this
    # again.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekey
          POSTGRES_PASSWORD: rekey
          POSTGRES_DB: rekey
        ports: ['5432:5432']
        # A service container with a healthcheck replaces the hand-rolled
        # `docker run` + poll loop: the job does not start until Postgres
        # actually answers queries.
        options: >-
          --health-cmd "pg_isready -U rekey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache

      # Build the libraries in parallel FIRST so the serial test run below hits
      # warm turbo cache for its `^build` dependencies instead of rebuilding
      # them one at a time. No app bundles: the suites import packages/* from
      # dist and never the panel/portal/admin/marketing builds.
      #
      # dist is load-bearing, not an optimisation: without it ~74 test files
      # fail to LOAD, and vitest reports that as a smaller passing count rather
      # than an error — a green-looking run proving nothing.
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="./packages/*"

      - name: Create test databases
        run: |
          PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_test;"
          PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_shadow;"

      - name: Verify migrations apply
        if: needs.changes.outputs.api == 'true'
        run: |
          DATABASE_URL=postgresql://rekey:rekey@localhost:5432/rekey?schema=public \
            pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      # The step above proves the migrations RUN. It does not prove they build
      # the schema `schema.prisma` describes. Editing the model without
      # generating the matching migration still applies cleanly to an empty
      # database and then diverges from every real one — drift that surfaces as
      # a Prisma runtime error in production, not as a red build.
      # `migrate diff --exit-code` replays the migration folder into a shadow
      # database and compares it to the datamodel. Exit 2 = they differ: run
      # `pnpm --filter @rekey.dev/api db:migrate` and commit the generated SQL.
      - name: Check schema.prisma matches its migrations
        if: needs.changes.outputs.api == 'true'
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://rekey:rekey@localhost:5432/rekey_shadow?schema=public \
            --exit-code

      # concurrency=1 is deliberate and must stay: every suite shares ONE
      # database and truncates between files, so two packages testing at once
      # eat each other's fixtures. This is the one place serialisation is
      # correctness, not slowness — do not "optimise" it.
      #
      # apps/api is invoked directly instead of through turbo so it can emit a
      # coverage report. It is the SAME single run, not an extra one, and it
      # stays sequential with the package tests below for the reason above.
      - name: Run API tests (with coverage)
        if: needs.changes.outputs.api == 'true'
        env:
          TEST_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_test?schema=public
          SUPER_ADMIN_KEY: test-admin-key-test-admin-key-test-admin-key
          JWT_SECRET: test-jwt-secret-test-jwt-secret-test-jwt-secret
        run: pnpm --filter @rekey.dev/api run test:coverage

      # Runs even when the thresholds fail — "what is the number now" is
      # exactly what you want in the summary when the gate is red.
      - name: Publish coverage summary
        # always(), so the number still lands in the summary when the coverage
        # gate itself is what went red. Scoped to runs that actually ran the API
        # suite, or it reports "no coverage" on every packages-only change.
        if: always() && needs.changes.outputs.api == 'true'
        run: |
          if [ ! -f apps/api/coverage/coverage-summary.json ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### apps/api coverage"
            echo
            echo "| metric | covered | total | % |"
            echo "| --- | ---: | ---: | ---: |"
            node -e '
              const fs = require("fs");
              const path = "apps/api/coverage/coverage-summary.json";
              const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
              for (const key of ["lines", "statements", "functions", "branches"]) {
                const m = total[key];
                console.log("| " + key + " | " + m.covered + " | " + m.total + " | " + m.pct + "% |");
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"


      # apps/api is not in this filter because the step above already ran it
      # directly, for coverage. One run, not two.
      #
      # panel, portal and admin ARE in it, as of this change. All three have had
      # vitest suites and a `test` script for as long as they have existed, and
      # none of them had ever run in CI: the filter listed only packages/* and
      # the two commercial apps, so 19 test files were enforced by nothing but
      # whoever remembered to run them locally. They stub `fetch` and cost
      # seconds, exactly like the marketing suite already in this list.
      #
      # Adding them here is the whole change. `changed-areas.mjs` derives which
      # paths count as "tested" by PARSING this filter list, so a front-end
      # change now also flips `packages` and stops skipping the job it needs.
      # That is why there is no second list to keep in sync.
      - name: Run package + app tests
        if: needs.changes.outputs.packages == 'true'
        env:
          TEST_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_test?schema=public
          SUPER_ADMIN_KEY: test-admin-key-test-admin-key-test-admin-key
          JWT_SECRET: test-jwt-secret-test-jwt-secret-test-jwt-secret
        run: >-
          pnpm exec turbo run test --concurrency=1
          --filter="./packages/*"
          --filter=@rekey.dev/panel
          --filter=@rekey.dev/portal

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    # Nothing outside apps/ and packages/ compiles into an artifact, so a docs
    # or migration-only change has nothing here to break.
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache

      # Next caches compilation between runs; without this every build is cold.
      - name: Cache Next.js builds
        uses: actions/cache@v4
        with:
          path: apps/*/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Only the SHIPPED apps. Examples are typechecked by the typecheck job but
      # no longer `next build`-ed: they are reference integrations, not deployed
      # artifacts, and they were roughly a third of this step. The trade-off is
      # real — `next build` catches server-component and static-generation
      # errors tsc does not — so if an example is ever deployed, add it back.
      #
      # turbo pulls each app's workspace dependencies in via `^build`, so the
      # packages/* dists exist before any Next build starts. Filtering with raw
      # `pnpm --filter` instead skips that graph and fails with "Can't resolve
      # '@rekey.dev/react'". No concurrency limit: unlike the tests these share
      # no state, and serialising five Next builds was the single largest cost
      # in the old pipeline.
      - name: Build shipped apps
        # Deliberately example.com, not rekey.dev. These compile into the
        # client bundles, this file is mirrored to the public repo, and CI
        # artifacts are never deployed — real values are passed as Docker build
        # args at deploy time. Baking our own host in here would put a
        # Rekey-owned default back into the open-source tree, which is exactly
        # what #249 removed.
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_APP_URL: https://example.com
        run: >-
          pnpm exec turbo run build
          --filter=@rekey.dev/api --filter=@rekey.dev/panel
          --filter=@rekey.dev/portal

  # ---------------------------------------------------------------------------
  # Payment-provider sandbox suite. NOT part of the pull-request pipeline.
  #
  # It talks to Stripe / PayPal / Razorpay over the network, so it can go red
  # for reasons a contributor cannot fix — and a required check that does that
  # is a check people learn to ignore. `workflow_dispatch` only, on purpose.
  # Run it before a release, and after any change under
  # apps/api/src/modules/billing/providers.
  #
  # Secrets it reads — see docs/provider-sandbox-testing.md for how to get each:
  #   STRIPE_TEST_SECRET_KEY
  #   PAYPAL_SANDBOX_CLIENT_ID / PAYPAL_SANDBOX_CLIENT_SECRET / PAYPAL_SANDBOX_WEBHOOK_ID
  #   RAZORPAY_TEST_KEY_ID / RAZORPAY_TEST_KEY_SECRET
  provider-sandbox:
    name: Provider sandbox (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekey
          POSTGRES_PASSWORD: rekey
          POSTGRES_DB: rekey
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rekey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema prisma/schema.prisma
      - uses: ./.github/actions/turbo-cache
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter="./packages/*"

      # Its own database, never rekey_test: the two suites truncate the same
      # tables and would eat each other's fixtures.
      - name: Create the sandbox database
        run: PGPASSWORD=rekey psql -h localhost -U rekey -d rekey -c "CREATE DATABASE rekey_sandbox;"

      - name: Run the provider sandbox suite
        env:
          SANDBOX_DATABASE_URL: postgresql://rekey:rekey@localhost:5432/rekey_sandbox?schema=public
          SUPER_ADMIN_KEY: sandbox-admin-key-sandbox-admin-key-sandbox
          JWT_SECRET: sandbox-jwt-secret-sandbox-jwt-secret-sandbox
          # The whole point of a job that HAS the secrets: a rotated or deleted
          # secret must fail it, not skip quietly and report green.
          REKEY_SANDBOX_REQUIRE: all
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
          PAYPAL_SANDBOX_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID }}
          RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
          RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
        run: pnpm --filter @rekey.dev/api run test:providers

  # ---------------------------------------------------------------------------
  # One check to rule them all.
  #
  # Now that jobs skip, this matters: a SKIPPED job does not report success to
  # branch protection, it reports nothing, so a rule requiring "Test" directly
  # would leave every docs-only pull request waiting forever on a check that is
  # never going to arrive. Requiring this job instead is immune to that, and to
  # any later change in which jobs exist.
  #
  # (Branch protection is not enabled on this repository today; it needs a paid
  # plan for private repos. This job exists so that turning it on later is one
  # setting and not a debugging session.)
  #
  # `provider-sandbox` is deliberately absent: it talks to Stripe, PayPal and
  # Razorpay over the network and can go red for reasons a contributor cannot
  # fix. A required check that does that is a check people learn to ignore.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, config, oss-strip, typecheck, test, build]
    steps:
      - name: Every job passed or was deliberately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job reported '$result'"; failed=1 ;;
            esac
          done
          exit "$failed"
