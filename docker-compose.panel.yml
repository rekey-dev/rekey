# Rekey — operator panel deployment unit (Dokploy compose service "rekey-panel").
# See docker-compose.api.yml header for the split-deploy rationale.
#
# The panel talks to the API over its PUBLIC origin (https://api.rekey.dev),
# not a shared docker network — that is what makes this unit independently
# deployable/restartable with zero coupling to the API's compose. Latency cost
# is one hop through Cloudflare/Traefik on server-side calls; acceptable.
#
# Security: this service holds NO secrets. REKEY_URL and PANEL_URL are public
# facts. If an env var here ever feels secret, it belongs on the api service.

services:
  panel:
    build:
      context: .
      target: panel-runtime
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: https://api.rekey.dev
        NEXT_PUBLIC_APP_URL: https://panel.rekey.dev
        # Explicit because the code has no fallback for either: the GA property
        # is Rekey-Cloud-specific (a self-hoster must not report to it) and the
        # portal origin is ours (a self-hoster's is their own).
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-BGRR27P2GD}
        NEXT_PUBLIC_PORTAL_URL: https://portal.rekey.dev
    image: rekey-panel:hosted
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      # Where this deployment tells people to get an invite key, shown on the
      # sign-up page when signup is invite-gated. Unset renders nothing, which
      # is right for a self-host. Named here because compose `environment:` is
      # an ALLOWLIST — a value set in Dokploy but absent here never reaches the
      # container, which has silently swallowed three controls already.
      PANEL_SIGNUP_HELP_URL: ${PANEL_SIGNUP_HELP_URL:-}
      NODE_ENV: production
      # Server-side panel -> API calls go over the public origin.
      REKEY_URL: https://api.rekey.dev
      PANEL_URL: https://panel.rekey.dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.rekey-panel.rule=Host(`panel.rekey.dev`)
      - traefik.http.routers.rekey-panel.entrypoints=websecure
      - traefik.http.routers.rekey-panel.tls.certresolver=letsencrypt
      - traefik.http.services.rekey-panel.loadbalancer.server.port=3031
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
