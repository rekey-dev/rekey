# Full Rekey stack — postgres + redis + api + panel + portal.
#
# The api/panel/portal services are behind the `full` profile, so:
#   - `docker compose up -d`                  → just postgres + redis (local dev:
#                                                run the apps from your shell)
#   - `docker compose --profile full up -d`   → the whole stack
#
# Usage:
#   cp .env.example .env   (then edit secrets — JWT_SECRET, ENCRYPTION_KEY, …)
#   docker compose --profile full up -d --build
#
# Database migrations run automatically on api boot (the api-runtime image runs
# `prisma migrate deploy` before starting the server) — no manual step needed.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: rekey
      # No default. An unset POSTGRES_PASSWORD fails the container start with a
      # clear Postgres error, which is the right outcome: the previous default
      # of `rekey` shipped a known credential on every deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: rekey
    ports:
      # Bound to loopback, NOT 0.0.0.0. Only the api container needs Postgres and
      # it reaches it over the compose network by service name; publishing on all
      # interfaces put the database on the public internet for anyone deploying
      # to a VPS without a host firewall. Loopback keeps `pnpm dev` against
      # dockerised datastores working.
      - "127.0.0.1:5432:5432"
    volumes:
      - rekey_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekey -d rekey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # AOF persistence so BullMQ webhook-delivery jobs (delayed retries) survive a
    # Redis restart. The DB retry poller backstops any gap; durable queue state
    # avoids needless re-deliveries on a bounce.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 24)}",
      ]
    ports:
      # Loopback only — same reasoning as Postgres above. An unauthenticated
      # Redis on a public interface is a trivially readable session/lockout store.
      - "127.0.0.1:6379:6379"
    volumes:
      - rekey_redis:/data
    environment:
      # redis-cli reads this, so the healthcheck below doesn't put the password
      # in a command line that shows up in `docker inspect`/`ps` output.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]    # only starts with `docker compose --profile full up`
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      target: api-runtime
    image: rekey-api:local
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rekey:${POSTGRES_PASSWORD}@postgres:5432/rekey?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:        ${JWT_SECRET:-change-me-in-prod}
      ENCRYPTION_KEY:    ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SUPER_ADMIN_KEY:   ${SUPER_ADMIN_KEY:-change-me-in-prod}
      API_URL:           http://api:3030
      # Public panel origin — the operator MCP OAuth authorize endpoint
      # redirects here (/mcp-consent). MUST be the public panel URL in a real
      # deploy or operator-MCP sign-in redirects to the wrong host.
      PANEL_URL:         ${PANEL_URL:-http://localhost:3031}
      # Browser origins allowed to call the API with cookies (the panel).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3031}
      # Public, internet-reachable API origin for provider webhook URLs. Set in
      # a real deploy (e.g. https://api.yourdomain.com); empty falls back to API_URL.
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
      # Local hosted-portal origin — auto-allowed for publishable-key calls.
      PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL:-http://localhost:3050}
      # Who can create operator (admin) accounts: open | invite | closed.
      # Default open for first-boot; switch to invite/closed on a private deploy.
      OPERATOR_SIGNUP_MODE: ${OPERATOR_SIGNUP_MODE:-open}
      # Starting ceilings for every workspace this deployment creates (JSON,
      # TenantLimitsSchema — e.g. {"maxProductionApps":1}). Empty = unlimited,
      # which is the default and what every workspace gets today.
      DEFAULT_TENANT_LIMITS: ${DEFAULT_TENANT_LIMITS:-}
      # Whether a signed-in operator may create additional workspaces:
      # open (default) | disabled. Creation only — switching and listing are
      # never gated.
      WORKSPACE_CREATION: ${WORKSPACE_CREATION:-open}
      # Operator MCP server (agent read + operate). On by default; false to disable.
      OPERATOR_MCP_ENABLED: ${OPERATOR_MCP_ENABLED:-true}
    ports:
      - "3030:3030"
    healthcheck:
      # Liveness, deliberately not /health/ready: restarting the API cannot fix
      # a Postgres or Redis outage, and a restart loop during one makes recovery
      # harder. Gate traffic on /health or /health/ready at the proxy instead.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  panel:
    profiles: ["full"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      target: panel-runtime
    image: rekey-panel:local
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # In-cluster API address the panel calls server-side.
      REKEY_URL: http://api:3030
      # Public API origin shown in the UI (e.g. the webhook URL operators paste
      # into Stripe). MUST be the public origin, not the in-cluster REKEY_URL.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3030}
      PANEL_URL:   ${PANEL_URL:-http://localhost:3031}
    ports:
      - "3031:3031"

  # Hosted multi-app customer portal (Portal V2). ONE deployment serves every
  # opted-in Application at /<slug> — no per-app secret key. Enable an app's
  # portal in Panel → Application → Billing → Portal, then visit
  # http://localhost:3050/<slug>. See docs/portal.md.
  portal:
    profiles: ["full"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      target: portal-runtime
    image: rekey-portal:local
    depends_on:
      - api
    environment:
      NODE_ENV: production
      REKEY_URL: http://api:3030
      PORTAL_BASE_URL: http://localhost:3050
    ports:
      - "3050:3050"

volumes:
  rekey_postgres:
  rekey_redis:
